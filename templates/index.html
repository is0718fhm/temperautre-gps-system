<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>水温計測システム</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<!-- Leaflet 地図 -->
<link rel="stylesheet" href="{{ url_for('static', filename='leaflet/leaflet.css') }}">
<script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>

<style>
    /* --------------------------------
       地図上の表示
       -------------------------------- */

    /* 過去データ選択中の明示 */
    .map-overlay-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 500;

        background: rgba(255, 153, 0, 0.9);
        color: #fff;

        padding: 6px 12px;
        border-radius: 6px;

        font-size: 13px;

        display: none;
    }
</style>

</head>

<body>

<div class="container">

    <h1>水温計測システム</h1>


    <!-- ================================
         計測状態
         ================================ -->

    <div class="card">

        <div class="row">
            <span class="label">計測状態</span>
            <span class="value" id="running-state">--</span>
        </div>

        <div class="row">
            <span class="label">状態メッセージ</span>
            <span class="value" id="message">--</span>
        </div>

    </div>


    <!-- ================================
         GPS
         ================================ -->

    <div class="card">

        <h2>GPS</h2>

        <div class="row">
            <span class="label">GPS状態</span>
            <span class="value" id="gps-fix">--</span>
        </div>

        <div class="row">
            <span class="label">緯度</span>
            <span class="value" id="latitude">--</span>
        </div>

        <div class="row">
            <span class="label">経度</span>
            <span class="value" id="longitude">--</span>
        </div>

    </div>


    <!-- ================================
         水温
         ================================ -->

    <div class="card">

        <div class="row temperature-row">
            <span class="label">水温</span>

            <span
                class="value temperature-value"
                id="temperature">
                -- ℃
            </span>
        </div>

    </div>


    <!-- ================================
         地図
         ================================ -->

    <div class="card">

        <h2>地図</h2>

        <div style="position:relative;">

            <!-- Leaflet地図 -->
            <div id="map"></div>

            <!-- 地図範囲外表示用 -->
            <div
                id="map-out-of-coverage"
                style="display:none;">
            </div>

            <!-- 過去データを表示している場合に地図左上へ表示 -->
            <div
                class="map-overlay-badge"
                id="file-status-badge">
            </div>

        </div>


        <!-- ============================
             地図に表示するデータ
             ============================ -->

        <div style="margin-top: 12px;">

            <select
                id="file-select"
                class="file-select">
            </select>

        </div>


        <!-- 保存ボタン -->

        <div style="margin-top: 10px;">

            <button
                id="save-btn"
                class="btn save"
                disabled>
                保存
            </button>

        </div>

    </div>


    <!-- ================================
         オフライン地図
         有線LAN接続時のみ表示
         ================================ -->

    <div
        class="card"
        id="map-download-card"
        style="display:none;">

        <h2>地図データ</h2>

        <div class="row">

            <span class="label">状態</span>

            <span
                class="value"
                id="map-download-message">
                待機中
            </span>

        </div>

        <div class="row">

            <span class="label">進捗</span>

            <span
                class="value"
                id="map-download-progress">
                --
            </span>

        </div>

        <div class="row">

            <span class="label">合計容量</span>

            <span
                class="value"
                id="map-total-size">
                --
            </span>

        </div>


        <!-- 地図名 -->

        <input
            type="text"
            id="map-name-input"
            class="file-select"
            placeholder="地図の名前(例: 〇〇池)">


        <!-- ズーム選択 -->

        <select
            id="map-zoom-select"
            class="file-select"
            style="margin-top:10px;">

            <option value="17">
                広い範囲向け(ズーム17まで・街区レベル)
            </option>

            <option value="18">
                狭い範囲向け(ズーム18まで・桟橋レベル)
            </option>

        </select>


        <!-- ダウンロード操作 -->

        <div
            class="button-card"
            style="margin-top:10px;">

            <button
                id="map-download-btn"
                class="btn save">
                保存
            </button>

            <button
                id="map-cancel-btn"
                class="btn stop"
                disabled>
                キャンセル
            </button>

        </div>


        <!-- 保存済み地図一覧 -->

        <div
            id="map-region-list"
            style="margin-top:14px;">
        </div>

    </div>


    <!-- ================================
         記録情報
         ================================ -->

    <div class="card">

        <div class="row">

            <span class="label">取得件数</span>

            <span
                class="value"
                id="records">
                --
            </span>

        </div>

        <div class="row">

            <span class="label">保存ファイル名</span>

            <span
                class="value"
                id="filename">
                --
            </span>

        </div>

    </div>


    <!-- ================================
         計測開始・終了
         ================================ -->

    <div class="card button-card">

        <button
            id="start-btn"
            class="btn start">
            開始
        </button>

        <button
            id="stop-btn"
            class="btn stop">
            終了
        </button>

    </div>


    <!-- ================================
         通信状態
         ================================ -->

    <div class="card">

        <span class="label">通信状態</span>

        <span
            class="value"
            id="connection-status">
            --
        </span>

    </div>

</div>


<!-- JavaScript -->

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
